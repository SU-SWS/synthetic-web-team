# Stanford Global Footer: the normative content contract
#
# Source of truth: SU-SWS/decanter-web components/GlobalFooter/GlobalFooter.tsx
# https://github.com/SU-SWS/decanter-web/blob/main/components/GlobalFooter/GlobalFooter.tsx
# Rendered: https://decanter.stanford.edu/examples/global-footer
# Extracted: 2026-08-10
#
# ==============================================================================
# THIS FILE IS THE CHECK. `sws check` reads it directly.
#
# The Global Footer is immutable: per the Identity Guide its links may not be
# altered, reordered, or added to, and nothing else may go inside it. Unit
# links belong in a LOCAL footer above it.
#
# Do not edit this file to make a project pass. Edit it only when the upstream
# component changes, and record the date.
# ==============================================================================

version: 1
extracted: 2026-08-10
upstream:
  repo: SU-SWS/decanter-web
  path: components/GlobalFooter/GlobalFooter.tsx
  ref: main

structure:
  element: footer
  # NOTE: the links are in TWO lists inside one <nav>, not one list of ten.
  # An earlier draft of this project assumed a single list. A check written
  # against a flat list will produce false failures on correct markup.
  nav:
    aria_label: global footer menu
  list_count: 2
  logo:
    present: true
    type: stacked
    color: white
    is_link: true

# ------------------------------------------------------------------ list one
# Stanford-wide wayfinding. Four links, this order.
resource_links:
  - label: Stanford Home
    href: https://www.stanford.edu
  - label: Maps & Directions
    href: https://visit.stanford.edu/plan/
  - label: Search Stanford
    href: https://www.stanford.edu/search/
  - label: Emergency Info
    href: https://emergency.stanford.edu

# ------------------------------------------------------------------ list two
# Policy and compliance. Six links, this order. `title` attributes are part of
# the upstream component and should be reproduced.
policy_links:
  - label: Terms of Use
    href: https://www.stanford.edu/site/terms/
    title: Terms of use for sites
  - label: Privacy
    href: https://www.stanford.edu/site/privacy/
    title: Privacy and cookie policy
    note: >
      This is how a Stanford site satisfies its cookie disclosure obligation.
      The upstream title says "Privacy and cookie policy" explicitly. No banner
      is required and none should be hand-rolled.
  - label: Copyright
    href: https://uit.stanford.edu/security/copyright-infringement
    title: Report alleged copyright infringement
  - label: Trademarks
    href: https://adminguide.stanford.edu/chapter-1/subchapter-5/policy-1-5-4
    title: Ownership and use of Stanford trademarks and images
    note: >
      CORRECTION: an earlier draft of this project used trademarks.stanford.edu.
      The canonical target is Admin Guide policy 1.5.4.
  - label: Non-Discrimination
    href: https://studentservices.stanford.edu/more-resources/student-policies/non-academic/non-discrimination
    title: Non-discrimination policy
    note: >
      CORRECTION: an earlier draft used equity.stanford.edu. The canonical
      target is Student Services.
  - label: Accessibility
    href: https://www.stanford.edu/site/accessibility
    title: Report web accessibility issues
    note: >
      Satisfies the MinWeb barrier-reporting requirement. Required on every
      public-facing Stanford site.

copyright:
  # Two spans upstream. Both lines are part of the fragment.
  lines:
    - "© Stanford University."
    - "Stanford, California 94305."

# ------------------------------------------------------------------ the check
check:
  severity: warn          # advisory, like everything except secrets
  weight: 5
  assertions:
    - id: footer.element
      requires: A <footer> element is present on every rendered page.
    - id: footer.nav-label
      requires: 'The footer contains <nav aria-label="global footer menu">.'
    - id: footer.link-set
      requires: >
        All ten links are present with exact labels and exact hrefs, in the
        order given, grouped as 4 then 6.
      mechanism: >
        Parse the DOM. Compare label text and href per list. Report each
        mismatch individually rather than as one failure, because "the footer
        is wrong" is not actionable and "Trademarks points at the wrong URL"
        is.
    - id: footer.no-additions
      requires: >
        No links other than these ten appear inside the Global Footer.
      mechanism: >
        Unit links belong in a local footer ABOVE the global footer. When this
        fails, say that, and say where the links should move to.
    - id: footer.copyright
      requires: Both copyright lines are present.

# ----------------------------------------------------------------- known gaps
open_questions:
  - >
    The upstream component appends an <SrOnlyText /> element to every link with
    no props. Purpose unconfirmed: likely external-link or "opens in new
    window" screen-reader text. Confirm with SWS before reproducing or omitting
    it, since it is an accessibility affordance and guessing either way is bad.
  - >
    The FlexBox wrapper carries title="Common Stanford resources" on a div.
    A `title` on a non-interactive element is not reliably announced by screen
    readers. Worth raising with the Decanter team rather than propagating.
  - >
    Classes in the reference HTML are Decanter 7 era (basefont-20, rs-py-1,
    type-3, list-unstyled, hocus:*). Verify against Decanter 8 before shipping.
    The CONTENT contract above is version-independent; the classes are not.
