# Stanford Identity Bar: the normative markup contract
#
# Source of truth: Decanter 8 beta examples
# https://deploy-preview-162--decanter.netlify.app/examples/identity-bar/
# Extracted: 2026-09-02
#
# ==============================================================================
# THIS FILE IS THE CHECK. `sws check` reads it directly.
#
# The Identity Bar is brand furniture, not a design opportunity. Its height and
# its logo size are fixed, because it appears on every Stanford site and an
# inconsistent one is immediately visible when two sites sit side by side.
#
# The classes below are the contract. They are not a suggestion about how to get
# a similar result: `pt-5 pb-1` is a five-pixel top and one-pixel bottom padding
# on Decanter's scale, and anything else produces a bar of the wrong height.
#
# Do not edit this file to make a project pass. Edit it only when the upstream
# example changes, and record the date.
# ==============================================================================

version: 1
extracted: 2026-09-02
upstream:
  site: Decanter 8 beta documentation
  path: /examples/identity-bar/

# ------------------------------------------------------------------- markup
# Reproduced verbatim from the upstream example, including the sr-only suffix,
# which exists because the link leaves the current site.
markup: |
  <div class="bg-cardinal-red px-20 pt-5 pb-1 sm:px-30 md:px-50 lg:px-30">
    <a class="logo inline-block text-20 leading-none text-white no-underline hocus:text-white hocus:underline" href="https://www.stanford.edu">Stanford University<span class="sr-only"> (link is external)</span></a>
  </div>

container:
  element: div
  # Every class, in the upstream order. The vertical padding is the part people
  # get wrong, and it is the part that decides the height.
  classes:
    - bg-cardinal-red
    - px-20
    - pt-5
    - pb-1
    - sm:px-30
    - md:px-50
    - lg:px-30
  # Classes that indicate someone has re-sized the bar. Any of these on the
  # container means the height is no longer the Stanford height.
  disallowed_class_patterns:
    - '^py-'          # symmetric vertical padding is never correct here
    - '^pt-(?!5$)'    # any top padding other than pt-5
    - '^pb-(?!1$)'    # any bottom padding other than pb-1
    - '^h-'           # a fixed height
    - '^min-h-'
    - '^max-h-'

link:
  href: https://www.stanford.edu
  text: Stanford University
  # `logo` is a Decanter component class, not a utility. It applies
  # --font-stanford with discretionary ligatures, and it forces cardinal red on
  # hover and focus -- which is why `text-white hocus:text-white` is needed to
  # override it inside the red bar.
  #
  # NOT font-serif. That renders in Source Serif 4 and loses the ligatures, and
  # it is the substitution this project shipped before being corrected.
  classes:
    - logo
    - inline-block
    - text-20
    - leading-none
    - text-white
    - no-underline
    - 'hocus:text-white'
    - 'hocus:underline'
  disallowed_class_patterns:
    - '^font-serif$'          # wrong mechanism; use .logo
    - '^font-sans$'
    # Numeric text sizes only. An earlier version of this pattern was
    # `^text-(?!20$)`, which also matched `text-white` -- a COLOUR, and a
    # required one -- so the check failed the very markup this file mandates.
    - '^text-(?!20$)\d+$'    # any numeric size other than text-20
    - '^(sm|md|lg|xl|2xl):text-\d+$'   # and no responsive size overrides
    - '^leading-(?!none$)'
  sr_only_suffix: ' (link is external)'

# Derived, not authored. Measured in Chromium at 1280x720 against the markup
# above with Decanter 8.0.0-beta.0, recorded so a change in height is visible in
# a diff rather than only in someone's eye.
measured:
  browser: Chromium 151
  date: 2026-09-02
  with_stanford_font_loaded: true
  bar_height_px: 30.8        # at 1280x720
  bar_height_range_px: [30.1, 30.8]   # 375, 640, 1024, 1280, 1600
  padding_top_px: 5
  padding_bottom_px: 1
  logo_font_size_px: 20
  logo_line_height_px: 20
  note: >
    Two corrections are recorded here rather than quietly overwritten. An early
    draft asserted 26px before anyone measured. The first real measurement gave
    28.8px -- but that was with the Stanford family ABSENT, so the line box came
    from the Source Serif 4 fallback. With the ligature font actually loaded the
    bar is 30.8px, and the spread across viewports tightens from 1.4px to 0.7px.
    30.8px is the Stanford height. A `py-12` container measures about 44px, which
    is the error this fragment exists to stop repeating.
  why_the_check_is_class_based: >
    Even correct, the height still drifts 0.7px across viewports. A pixel
    assertion would be flaky and a flaky brand check gets switched off. The
    classes are exact and deterministic, and on Decanter's scale they can only
    produce the Stanford height -- provided the font is loaded, which is checked
    separately.

# ------------------------------------------------------------------- font
# REQUIRED wherever this bar appears. Not optional, and not something to skip
# because upstream's own docs site happens to omit it.
#
# Decanter's --font-stanford is
# `Stanford, "Source Serif 4", Georgia, Times, "Times New Roman", serif`, and
# Decanter 8 publishes no font assets: static/fonts/stanford.woff2 exists in its
# repository but is not in the npm package. So a project that does nothing gets
# the Source Serif 4 fallback, and the wordmark renders in the wrong typeface --
# a brand defect that looks like a rendering quirk rather than a mistake.
font:
  family: Stanford
  required: true
  weight: 300
  # Verified 2026-09-02: both HTTP 200 with valid magic bytes. woff2 is 3,816
  # bytes and woff is 7,552, so woff2 goes first. Decanter v7's own fonts.css
  # lists only woff and ttf; the woff2 exists and is half the size.
  sources:
    - url: https://www-media.stanford.edu/assets/fonts/stanford.woff2
      format: woff2
      bytes: 3816
    - url: https://www-media.stanford.edu/assets/fonts/stanford.woff
      format: woff
      bytes: 7552
  origin: University Communications media CDN, the same origin Decanter v7 uses
  css: |
    @font-face {
      font-family: 'Stanford';
      src:
        url('https://www-media.stanford.edu/assets/fonts/stanford.woff2') format('woff2'),
        url('https://www-media.stanford.edu/assets/fonts/stanford.woff') format('woff');
      font-weight: 300;
      font-display: swap;
    }
  also: >
    Add `<link rel="preconnect" href="https://www-media.stanford.edu" crossorigin>`.
    It is a separate origin and the Identity Bar is the first thing painted.
  privacy_note: >
    This is a third-party origin and `sws perf` will list it. It is a Stanford
    origin serving one 3.8 KB font, so it is not a MinPriv concern, but it is
    worth knowing it appears in that list rather than being surprised by it.
  measured_effect: >
    With the font loaded the bar is 30.8px; without it, 28.8px. So the font is
    not only a typeface question -- omitting it changes the bar's height.

# --------------------------------------------------------------------- notes
placement:
  rule: >
    Nothing may appear above the Identity Bar except a skip navigation link.
    Checked separately by brand.identity-bar.nothing-above, which tests DOM
    position rather than string order.
  full_width: >
    The padding sits directly on the red container. Do NOT wrap the link in a
    centred max-width container: upstream does not, and doing so changes where
    the logo sits relative to every other Stanford site.

fonts_correction: >
  An earlier version of this file said "do not add a font file to fix it",
  reasoning that the Decanter documentation site itself loads only Google Fonts
  and therefore renders the fallback too. That was wrong, and wrong in a
  characteristic way: it took current practice on one site as intent. The
  wordmark is the Stanford wordmark, the ligature font is what makes it that,
  and Decanter v7 shipped a fonts.css that loaded it from exactly the CDN named
  above. See standards/patterns/sws-conventions.md on inferring intent from
  presence.
