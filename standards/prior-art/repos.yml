# SWS source repos: inspected prior art
#
# Inspected 2026-08-10 by reading package.json on each repo's default branch,
# then corrected by SWS review the same day.
# Unlike live_exemplars in catalog.yml, these have READABLE SOURCE, so `era` is
# verified rather than assumed.
#
# ==============================================================================
# PRECEDENCE, ALL THREE CLAUSES (full version in README.md):
#
#   1. Prior art informs HOW we solved a problem shape. Standards decide WHAT
#      to build with. A repo on Decanter 7 + Tailwind 3 is DATED: do not copy
#      its CSS.
#   2. Repeated identical choices are a CONVENTION worth adopting. cnbuilder
#      ^3.1.0 pinned across seven repos is knowledge, not drift.
#   3. But NEITHER tells you WHY a dependency is there, nor WHERE the org is
#      heading. Both require asking a person.
#
# Clause 3 is not theoretical. This pass produced four proposed corrections to
# our standards and THREE WERE WRONG:
#
#   - sa11y correlates PERFECTLY with Storyblok here (5/5 with, 6/6 without).
#     I read the count and called it a developer a11y convention. It is a
#     CONTENT-AUTHOR tool used in Visual Editor overlays. When a dependency
#     correlates tightly with another, it probably belongs to that domain.
#   - Cypress in 3 repos and Playwright in 0 looked decisive. SWS is moving to
#     Playwright. Lockfiles record executed decisions, never intent.
#   - sws-astro on Astro 6 looked like a constraint to adopt. The real answer
#     was to stop naming versions in recipes at all.
#
# Full record, kept deliberately: standards/patterns/sws-conventions.md
# ==============================================================================

version: 1
inspected: 2026-08-10
corrected: 2026-09-03
method: package.json on default branch via GitHub API, then SWS review

# 2026-09-03: hosting recorded per family for the first time, and it corrected a
# standing error. This file previously implied Netlify was the only platform.
# See the ANSWERED block at the foot of this file, entry H1.

# ------------------------------------------------------------------------------
# WATCH THE DEFAULT BRANCH. It is not `main` for most of these.
#   main -> sws-astro
#   dev  -> adapt-stanford-homesite, adapt-online-giving, adapt-directory,
#           ood-giving-campaign, ood-stanford-tour, ccc-bulletin
#   1.x  -> cardinalsites-nextjs, csp-nextjs, sulgryphon-nextjs, summer-nextjs,
#           press-nextjs
# Any prior-art pointer MUST carry an explicit ref or it silently reads the
# wrong branch.
#
# NOTE ON VERSIONS BELOW: recorded as observed, for era classification only.
# Recipes do not pin versions. See sws-conventions.md.
# ------------------------------------------------------------------------------

families:
  astro-decanter8:
    what: Astro with Decanter 8 and Tailwind 4. Newest, smallest, closest to astro-static.
    hosting: not established. No deploy config in the repo.
    members:
      - sws-astro
  storyblok-next-netlify:
    what: >
      Next + Storyblok + Netlify. The Office of Development / ADAPT family.
      npm, cnbuilder, netlify-plugin-vault-variables for secrets, and sa11y in
      the Visual Editor overlay for content authors.
    hosting: >
      NETLIFY. The Netlify-specific tooling in this family is the evidence:
      netlify-plugin-vault-variables for secrets, @netlify/plugin-csp-nonce and
      blobs/edge/functions in the homesite and ccc-bulletin.
    members:
      - adapt-stanford-homesite
      - adapt-online-giving
      - adapt-directory
      - ood-giving-campaign
      - ood-stanford-tour
      - ccc-bulletin
  decoupled-drupal:
    what: >
      Next + GraphQL against Drupal. yarn 4, graphql-codegen, Algolia,
      clsx + tailwind-merge, .githooks. Four of five run --webpack; the newest
      member does not.
    hosting: >
      VERCEL. Confirmed by SWS 2026-09-03 and verified in source: vercel.json at
      the root of sulgryphon-nextjs with no netlify.toml, and press-nextjs
      publishes to stanford-university-press.vercel.app. Secrets come from
      node-vault rather than a host build plugin, which is what makes this
      family's secret handling host-portable.
    members:
      - cardinalsites-nextjs
      - csp-nextjs
      - sulgryphon-nextjs
      - summer-nextjs
      - press-nextjs

repos:
