    influences: decanter-8
    rating: exemplary
    live: https://www.stanford.edu/
    stack:
      framework: "next ^16.0.0"
      decanter: >
        NOT A DEPENDENCY BY DESIGN. Derived design system. See lineage.
      tailwind: "^4.2.1 via @tailwindcss/postcss"
      cms: "@storyblok/react ^5.4.18"
      node: ">=22.0.0"
      package_manager: npm
      other:
        - "Storybook 10 + addon-a11y + nextjs-vite"
        - Cypress 15
        - Jest 29
        - MSW
        - "sa11y ^4.3.5 (author-facing)"
        - FontAwesome Pro
        - maplibre
        - "@google-cloud/discoveryengine"
        - "@google/genai"
        - "@netlify/plugin-csp-nonce"
        - netlify-plugin-vault-variables
    why_exemplary: >
      This is www.stanford.edu. The most scrutinised Stanford web property and
      by far the most complete engineering setup in the set: Storybook with the
      a11y addon, Cypress e2e and component, Jest, MSW mocking, CSP nonces, and
      Vault-managed secrets.
    use_for:
      - >
        THE reference for testing and QA rigour, at the scale of a flagship
        property. Read it for what thorough looks like, not as a shopping list:
        this project deliberately does NOT adopt a component workshop, since
        most unit sites have a handful of components and one consumer.
      - >
        Global Footer and Identity Bar as shipped on the canonical site. Brand
        furniture is authoritative here regardless of the design system lineage,
        because brand is brand.
      - CSP implementation via "@netlify/plugin-csp-nonce"
      - Secrets via HashiCorp Vault rather than env files
      - AI-adjacent search via Google discoveryengine + genai, relevant to GEO
      - >
        A preview of where Decanter 8 is heading, since patterns here are
        feeding back into it.
    do_not_use_for:
      - >
        FontAwesome Pro. Licence-gated with a preinstall token check, and
        Decanter recommends heroicons. Do not propagate it to unit sites.
      - >
        Decanter conformance. Its tokens and CSS are a PARALLEL VOCABULARY, not
        Decanter's. Copying them into a Decanter 8 project produces something
        that looks approximately right and does not use the design system.
    notable:
      - >
        ANSWERED (SWS, 2026-08-10): no `decanter` dependency is deliberate. This
        is its own design system, heavily derived from Decanter, and it is
        currently influencing Decanter 8. It sits UPSTREAM of the design system,
        not downstream of it.
      - >
        Therefore `era` does not apply in the usual linear sense. See the
        lineage note in README.md: newer is not automatically better, and this
        repo can be simultaneously ahead of Decanter 8 and incompatible with it.
      - Storybook build is conditional on $NETLIFY and published to /storybook.
    priority: highest

