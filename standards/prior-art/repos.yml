# ==============================================================================
# ANSWERED (SWS, 2026-08-10)
#
# A1. www.stanford.edu does not consume Decanter. It is its own design system,
#     heavily derived from Decanter, and it is currently INFLUENCING Decanter 8.
#     Consequence: `era` is not a linear timeline. Some work sits upstream of
#     the design system. See the lineage section in README.md.
#
# A2. cardinalsites-nextjs and csp-nextjs are intentional sibling instances,
#     two clients, one copied from the other. Both citable. Also the clearest
#     example of the copy-fork pattern this project is trying to improve on
#     rather than replace. See sws-conventions.md.
#
# A3. summer-nextjs uses Cookiebot because the CLIENT required it. Stanford
#     centrally licenses no cookie banner service. Documented one-off, not a
#     pattern. Never name a consent vendor; route to the Privacy Office.
