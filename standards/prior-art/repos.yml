# ANSWERED BY SWS, 2026-09-01. All four. Kept here with the answers, because the
# questions are the more reusable artefact: each one is a thing repo inspection
# could never have established.
#
# 1. `adapt-auth-sdk` -- what is it, and is it sanctioned?
#    ANSWER: a SAML auth library for ALUMNI-based websites only.
#    `weblogin-auth-sdk` is the PREFERRED package for everything else: also
#    SAML, integrating with Weblogin, Stanford's primary SSO. So the two repos
#    using adapt-auth-sdk are NOT a general endorsement.
