# 2. All four decoupled-drupal repos pin `--webpack`. Known issue?
#    ANSWER: a point-in-time decision to not adopt Turbopack. NOT a forward
#    choice. Turbopack IS the forward choice for Next.js sites.
#    Note the four repos are ONE lineage, so this was one decision copy-forked,
#    not four independent votes. See the "count lineages, not repos" clause in
#    README.md -- this question is where that clause came from.
#    -> standards/patterns/sws-conventions.md, record of error, row 4
#
# 3. Is there an intended house headless component library?
#    ANSWER: no, there is none. Confirmed absence, not an oversight. And this is
