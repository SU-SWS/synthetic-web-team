# ==============================================================================
# ANSWERED BY SWS, 2026-09-03. The hosting question, and the biggest single
# correction this file has taken.
#
# H1. Which hosts do we actually deploy to?
#     ANSWER: TWO, split cleanly by family.
#       - storyblok-next-netlify (ADAPT/OOD)  -> NETLIFY
#       - decoupled-drupal (Cardinal Sites)   -> VERCEL
#     And press-nextjs, a fifth decoupled-drupal repo, was missing from this
#     file entirely.
#
#     WHAT WE HAD WRONG. This file and sws-conventions.md both asserted
#     "Netlify is the platform. Vercel appears once, as @vercel/speed-insights."
#     That reading came from counting npm dependencies, and npm dependencies do
#     not record where a repo deploys. The Vercel family leaves almost no trace
#     in package.json BECAUSE it uses node-vault for secrets instead of a host
#     build plugin -- the more portable choice, which is precisely why it is
#     invisible to dependency inspection. The one signal we did see, a stray
#     @vercel/speed-insights, we then discounted as copy-fork noise.
#
#     Verified in source after the answer, 2026-09-03: sulgryphon-nextjs has
#     vercel.json at its root and no netlify.toml, and press-nextjs publishes to
#     stanford-university-press.vercel.app.
#
#     WHY IT MATTERS BEYOND THE FACT. "Netlify is the platform" was about to
#     become a recipe naming scheme and a swap-point cost ("you leave the
#     platform every other SWS project uses"). That sentence would have been
#     wrong to roughly half the org, and it is the kind of wrong that makes a
#     team ignore the whole toolchain. Recipes now carry a hosting axis:
#     standards/hosting/.
#     -> standards/hosting/, standards/patterns/sws-conventions.md
#
# H2. Do we require a Content-Security-Policy?
#     ANSWER: NO. Nonce-based CSP is a NICE-TO-HAVE, not a requirement.
#     Confirmed against minweb.md, which requires no response headers at all.
#     Security headers SHOULD ship with sensible defaults, but a CSP locked to
#     specific domains is explicitly NOT wanted: it puts a non-technical site
#     owner one embedded video away from a broken page they cannot diagnose.
#
#     So the decoupled-drupal family setting no security headers is PERMITTED,
#     not a finding. Only the homesite's full header set is exemplary, and
#     exemplary is not the bar.
#     -> standards/hosting/capabilities.yml
#
# METHOD NOTE, for the next person doing an inspection pass: package.json tells
# you what a project INSTALLS. It does not tell you where it deploys, who owns
# it, or what the production domain is. Three of those four need a person. This
# is now the second time clause 3 has produced the largest correction in a pass.
# ==============================================================================
