  - name: sws-astro
    url: https://github.com/SU-SWS/sws-astro
    ref: main
    family: astro-decanter8
    era: decanter-8
    rating: exemplary
    stack:
      framework: "astro ^6.4.4"
      decanter: "github:SU-SWS/decanter#v8"
      tailwind: "^4.3.0 via @tailwindcss/vite"
      react: "^19.2.7 via @astrojs/react"
      node: ">=22.12.0"
      other:
        - "@astrojs/sitemap"
        - "@astrojs/check"
        - cnbuilder
        - motion
        - heroicons
        - number-flow
    why_exemplary: >
      SWS's own reference implementation of very nearly the stack the
      astro-static recipe describes. When the recipe and this repo disagree,
      investigate before assuming the recipe is right.
    use_for:
      - THE canonical reference for Astro + Decanter 8 + Tailwind 4 wiring
      - Astro + React island composition
      - eslint config for Astro projects via eslint-plugin-astro
      - "`astro check` as the typecheck step"
    do_not_use_for: []
    notable:
      - Installs Decanter from the v8 GIT BRANCH, not npm. Predates the npm publish.
      - >
        Runs Astro 6 while 7 is current. NOT a constraint to copy: SWS confirmed
        Astro 7 is fine and that recipes should install latest.
      - "Carries overrides.vite ^7.3.2, suggesting a known Vite resolution issue."
      - No test harness of any kind. Not a testing reference.
    priority: highest

