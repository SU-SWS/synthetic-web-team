#
# 4. Adopt a www.stanford.edu pattern not yet in Decanter 8?
#    ANSWER: yes, go ahead. Decanter 8 is NOT a hard line on design choices.
#    Almost everything in the Stanford ecosystem is a carrot rather than a
#    stick, and the toolchain must be attractive to work with -- anyone who gets
