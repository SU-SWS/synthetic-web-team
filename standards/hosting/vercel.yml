# Host profile: Vercel
#
# reviewed: 2026-09-03
# status: in production across the decoupled-drupal family (5 repos, 1 lineage).
#
# NOTE ON THIS FILE'S HISTORY: until 2026-09-03 this project's standards said
# Vercel "appears once across eleven repos" and called it a swap that costs you
# the shared tooling. Both statements were wrong. Vercel carries library.stanford.edu,
# the Cardinal Sites front end, and sup.org. See standards/prior-art/repos.yml,
# ANSWERED block H1.

id: vercel
name: Vercel
pairs_with: [astro-static, astro-ssr, next-ssr]
prior_art_family: decoupled-drupal

# ----------------------------------------------------------------- the opinion
pick_this_when: >
  The unit is already on Vercel, or the project is a decoupled Drupal front end
  and wants to inherit the Cardinal Sites family's wiring. Five SWS repos sit
  here including library.stanford.edu, so this is well-trodden ground, not a
  detour. It is also the most natural home for a Next project: the framework and
  the platform ship from the same vendor, so Next features tend to work on
  release day rather than after an adapter catches up.

do_not_pick_this_when: >
  The unit already administers a Netlify account. Neither host is the house
  default and moving a team between them buys nothing.

# ------------------------------------------------------------------- capability
capabilities:
  required:
    https-live-cert: Yes, automatic, including custom domains.
    custom-domain: >
      Yes. CHECK THIS ONE: press-nextjs currently publishes to
      stanford-university-press.vercel.app, and a *.vercel.app URL is a preview
      domain, not an approved Stanford subdomain. Fine pre-launch, not fine at
      launch.
    admin-mfa: >
      Available and REQUIRED BY MINWEB for the dashboard. Not on by default.
      Enable it and attest to it on the launch checklist.
    no-committed-secrets: >
      node-vault, reading from HashiCorp Vault in application code. This is the
      family convention AND the host-portable one, since it does not depend on a
      host build plugin. Prefer it over the Vercel environment variable UI, and
      prefer it generally if the project might change hosts.
    named-admin-access: >
      Team membership. Same failure mode as Netlify: a site deployed from a
      personal account rather than the team.
    sunsettable: Delete the project, then remove the DNS record.
  recommended:
    security-headers-default: >
      Yes, and THIS IS THE GAP TO CLOSE. No repo in the Vercel family sets any
      security headers: sulgryphon-nextjs's headers() sets only X-Robots-Tag for
      non-production, and its vercel.json has redirects and rewrites but no
      headers key at all. That is PERMITTED — MinWeb requires no headers — but it
      means new work here should ship the default set from capabilities.yml
      rather than copy the family. See below for the config.
    csp: >
      Hand-rolled: there is no first-party plugin for it. Still OFF by default
      per capabilities.yml, and here the implementation cost is real on top of
      support cost.
    preview-urls: Yes, per pull request, and the best-in-class version of it.
    redirects: >
      Yes, vercel.json. sulgryphon-nextjs is the reference and worth copying
      wholesale for any site replacing a legacy Drupal or WordPress install.
    cms-rebuild-webhook: >
      DEFERRED, not missing. Deploy hooks work; this package has no CMS to fire
      them. See standards/scope.md.
    server-runtime: >
      Yes, and the strongest of the three. ISR, route handlers, image
      optimization, and Next features generally land here first.

# ---------------------------------------------------------------------- how to
adapters:
  astro: "@astrojs/vercel"
  next: none needed. First-party.
  note: Install latest. Do not pin.

headers:
  mechanism: >
    Prefer headers() in next.config.ts (or the Astro adapter's config) so the
    policy travels with the app. vercel.json's headers array is the alternative
    and is right for a static build with no framework config.
  vercel_json_mechanism: |
    // vercel.json — for astro-static, or when you want it in host config.
    {
      "headers": [
        {
          "source": "/(.*)",
          "headers": [
            {"key": "Strict-Transport-Security", "value": "max-age=31536000; includeSubDomains; preload"},
            {"key": "X-Content-Type-Options", "value": "nosniff"},
            {"key": "Referrer-Policy", "value": "origin-when-cross-origin"},
            {"key": "Permissions-Policy", "value": "geolocation=(), camera=(), microphone=(), midi=(), payment=(), usb=()"},
            {"key": "X-Frame-Options", "value": "SAMEORIGIN"}
          ]
        }
      ]
    }
  precedence_gotcha: >
    vercel.json headers and next.config.ts headers() BOTH apply and are not
    merged predictably when they collide. Pick one place.

deploy:
  trigger: >
    Push to main deploys, via the git integration. GitHub Actions is then for
    checks only.
  config_file: vercel.json
  build_note: >
    sulgryphon-nextjs sets buildCommand "yarn build --webpack" and installCommand
    "yarn workspaces focus --production" in vercel.json. The --webpack flag is a
    point-in-time decision, NOT guidance: Turbopack is the forward default, and
    press-nextjs has already dropped the flag.

prior_art:
  - repo: sulgryphon-nextjs
    ref: 1.x
    public: true
    for: >
      THE reference for this host, and readable without access since it is
      public and MIT licensed. Its vercel.json is the best legacy-redirect
      example in the set: nine rules catching /node/*, /taxonomy/*, /wp-content/*,
      *.php, *.htm* and *.sh, plus three rewrites to discover.stanford.edu.
      Also carries proxy.ts, a honeypot bot filter on /all — note that this is
      NOT a CSP implementation, in case the filename suggests otherwise.
  - repo: press-nextjs
    ref: 1.x
    public: true
    for: >
      The NEWEST member of the family, so cite it over its siblings for current
      practice. First in the set to drop --webpack. sup.org is also the live
      MinWeb example of a Stanford-branded non-stanford.edu domain.
  - repo: cardinalsites-nextjs
    ref: 1.x
    for: >
      Decoupled Drupal via graphql-codegen, the SAML reference via passport-saml,
      and node-vault secret retrieval.

prior_art_note: >
  All five are Decanter 7 and Tailwind 3. Read them for hosting, redirects, data
  fetching, and secrets. NEVER for CSS.

gotchas:
  - >
    Do not copy the family's header posture. It has none. Copying it is how a
    "follow prior art" instinct produces a site with weaker defaults than the
    recipe intends.
  - >
    A *.vercel.app production URL is not an approved Stanford subdomain. The
    subdomain name is University Communications' decision, has a lead time, and
    is not something this tool or a developer can approve.
  - >
    Deploying from an individual's personal Vercel account rather than the team
    breaks named-admin-access the day that person leaves.

# ------------------------------------------------------------------ provisioning
# The agent-run path, for a project that has already decided Vercel per the
# table above. NOT VERIFIED against a live deploy: no project in this repo runs
# Vercel yet, the same disclaimer standards/hosting/netlify.yml carries. Treat
# every step as reasoned from the Vercel CLI's own --help output and
# documentation and from how the decoupled-drupal family is shaped -- not as
# proven. Correct this file the first time someone actually runs it. The
# `sws-vercel` skill drives these in order.
#
# THE SAME SHAPE OF LIMIT AS NETLIFY, for the same underlying reason: Vercel's
# git integration also runs through a GitHub App, and installing that app for
# an account or org the first time is a browser consent screen with no API
# substitute -- `vercel git connect` assumes the app grant already exists or
# walks you to get it. requirements.yml already reflects this: vercel-cli is
# `optional`, because deploy comes from the git integration, not the CLI.
provisioning:
  prerequisite:
    run: |
      npx sws preflight        # then install what it names, then run it again
    needs: >
      git, mandatory regardless of host. The Vercel CLI (`vercel-cli`, binary
      `vercel`) is OPTIONAL here, same as netlify-cli -- useful for env vars,
      verification, and a manual first deploy, but not required to make
      push-to-main deploy.
    the_decision: >
      Use the CLI where it helps (linking, env vars, verification) and the
      dashboard where the CLI cannot substitute for it (the first GitHub App
      grant for a team that has never connected a repo before). No MCP-server
      alternative is worth adding, same reasoning as Netlify: the one step that
      genuinely needs a browser needs it regardless of transport.
    version_floor: Anything current. Install latest; do not pin.

  steps:
    - id: auth
      what: Authenticate. Opens a browser; there is no headless flow.
      run: |
        vercel whoami || vercel login
      note: >
        `vercel login` supports email OTP or browser SSO and stores the token
        in the CLI's own global config, not in the project. `vercel whoami`
        first makes a re-run a no-op, same reasoning as `gh auth status` and
        `netlify status`.
      honest_limit: >
        Creating a VERCEL ACCOUNT, as opposed to logging into an existing one,
        needs a browser and cannot be scripted -- the same shape of limit as
        GitHub account creation in github-pages.yml.

    - id: choose-team
      what: Decide which team owns the project. Ask; do not assume.
      run: |
        vercel teams ls
      note: >
        PREFER A TEAM, NOT A PERSONAL ACCOUNT, same reasoning as
        github-pages.yml's choose-owner and netlify.yml's choose-team: a site
        whose only deploy access belongs to one person breaks
        named-admin-access the day that person leaves. If they have no team
        access, that is an escalation, not something to work around -- see
        standards/policy/escalation.md.

    - id: link-project
      what: Link the local working directory to a new or existing Vercel project.
      run: |
        vercel link --yes --scope <team-slug>
      note: >
        `--yes` accepts Vercel's detected framework defaults rather than
        prompting for each one, which is what makes this step scriptable where
        the next one is not. Creates `.vercel/project.json` locally; add it to
        `.gitignore` -- it is a machine-local pointer, not project config.
      honest_limit: NOT VERIFIED. Reasoned from `vercel link --help`.

    - id: connect-repo
      what: >
        Connect the project to the GitHub repo for continuous deployment. THE
        STEP THAT CAN NEED A BROWSER, same shape as `netlify.yml`'s
        connect-repo and GitHub account creation in github-pages.yml -- name it
        rather than pretending around it.
      run: |
        vercel git connect
      note: >
        Works without a browser prompt once the team's Vercel-for-GitHub App
        already covers this repo's org. For a team's FIRST repo, it walks the
        GitHub App installation, which is an OAuth consent screen with no API
        substitute. Tell the person this is coming before running it.
      honest_limit: >
        NOT VERIFIED end to end. Reasoned from `vercel git connect --help` and
        Vercel's own Git integration documentation.

    - id: build-config
      what: Commit `vercel.json` for headers, redirects, and build overrides.
      source: standards/recipes/astro-ssr/RECIPE.md, step 8b
      note: >
        Prefer config that travels with the repo over dashboard settings, for
        the same reason secrets go in Vault rather than a host UI. Reserve
        `vercel env add` for values that must not be committed, and prefer
        `node-vault` -- the host-portable option and the decoupled-drupal
        family convention -- over hand-set dashboard values. See
        `no-committed-secrets` above.

    - id: verify
      what: Confirm the deploy, and check what MinWeb asks for while you are here.
      run: |
        vercel project ls
        vercel inspect <deployment-url>
      note: >
        Same caveat as Netlify: there is no single boolean confirmed here
        against a live API response the way `gh api .../pages` returns
        `https_enforced`. Vercel's automatic HTTPS is close to unconditional for
        a Vercel-managed or correctly CNAMEd custom domain, but confirm the
        certificate is actually live on first real use. Also confirm the
        production URL is not still a bare `*.vercel.app` preview domain -- see
        the custom-domain gotcha above.

  what_this_does_not_do:
    - Approve the stanford.edu subdomain. University Communications, with a lead time.
    - Request the ODA accessibility review. Pre-launch gate, needs lead time.
    - Register with Siteimprove. Required for public sites, its own intake.
    - Attest MFA on the Vercel team dashboard. An administrative login under MinWeb.
    - Name the business owner and technical administrator in .sws/manifest.yml.
    - >
      Wire up node-vault end to end. That is a Vault credential exchange the
      unit's Vault administrator has to grant, not something this CLI sequence
      can provision alone.

procurement: >
  An existing SWS vendor relationship, so a project joining an existing team
  account has nothing new to procure. A NEW account, or a new billing
  arrangement, is a procurement question. State the obligation, name the
  office, stop. See standards/policy/procurement.md.
