# Host profile: Netlify
#
# reviewed: 2026-09-03
# status: in production across the storyblok-next-netlify family (6 repos, 1 lineage).

id: netlify
name: Netlify
pairs_with: [astro-static, astro-ssr, next-ssr]
prior_art_family: storyblok-next-netlify

# ----------------------------------------------------------------- the opinion
pick_this_when: >
  The unit is already on Netlify, or wants to inherit the ADAPT/OOD family's
  wiring wholesale. This is the better-trodden of the two paid paths for CONTENT
  sites: six repos including www.stanford.edu sit here, and the Vault secrets
  plugin is a solved problem.

do_not_pick_this_when: >
  The unit already administers a Vercel account. Moving them is not worth it —
  see vercel.yml. Also not worth it for a purely static twelve-page site that
  needs no headers and no previews; GitHub Pages is free.

# ------------------------------------------------------------------- capability
capabilities:
  required:
    https-live-cert: Yes, automatic, Let's Encrypt, including custom domains.
    custom-domain: Yes. DNS via CNAME to the Netlify hostname.
    admin-mfa: >
      Available and REQUIRED BY MINWEB for the dashboard. Not on by default —
      enable it and attest to it. Team-level SSO where the account supports it.
    no-committed-secrets: >
      netlify-plugin-vault-variables, pulling from HashiCorp Vault at build
      time. This is the family convention; follow it rather than introducing a
      new pattern. Netlify's own environment variable UI works but leaves the
      value outside Vault.
    named-admin-access: >
      Team membership. Watch for sites deployed from an individual's personal
      account rather than the team — that is the failure mode here.
    sunsettable: Delete the site, then remove the DNS record.
  recommended:
    security-headers-default: >
      Yes, two ways. Ship the default set from capabilities.yml.
    csp: >
      OFF by default per capabilities.yml -- the plugin ecosystem removes some
      of the implementation cost of adding one, not the support cost of a page
      an owner cannot un-break.
    preview-urls: Yes, per pull request. The main reason to move off Pages.
    redirects: >
      Yes, netlify.toml [[redirects]] or a _redirects file. Full support
      including splats, query params, and status codes.
    cms-rebuild-webhook: >
      DEFERRED, not missing. Build hooks work and are well-trodden here, but
      this package has no CMS to fire them. See standards/scope.md.
    server-runtime: >
      Yes. Functions, edge functions, blobs, and @netlify/plugin-nextjs for
      full Next support. All in production use in this family.

# ---------------------------------------------------------------------- how to
adapters:
  astro: "@astrojs/netlify"
  next: "@netlify/plugin-nextjs"
  note: Install latest. Do not pin. See standards/stack/reference-versions.yml.

headers:
  static_mechanism: |
    # netlify.toml — works for astro-static and astro-ssr alike.
    [[headers]]
      for = "/*"
      [headers.values]
        Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "origin-when-cross-origin"
        Permissions-Policy = "geolocation=(), camera=(), microphone=(), midi=(), payment=(), usb=()"
        X-Frame-Options = "SAMEORIGIN"
  next_mechanism: >
    On Next, prefer headers() in next.config.ts so the config travels with the
    app rather than living in host config. @netlify/plugin-nextjs honours it.
    Gate on the deploy environment if it fights local development.
  precedence_gotcha: >
    If you set the same header in BOTH netlify.toml and next.config.ts, the
    netlify.toml value wins on Netlify. Pick one place. Two places is how a
    header ends up with a value nobody in the repo wrote.

deploy:
  trigger: >
    Push to main deploys. Netlify's git integration handles this; the GitHub
    Actions workflow is then for checks only, not for deploying.
  config_file: netlify.toml

prior_art:
  - repo: adapt-stanford-homesite
    ref: dev
    for: >
      THE reference for this host. Vault variables and environment detection.
      Read its Netlify-specific wiring; do NOT read its CSS or copy FontAwesome Pro.
  - repo: ccc-bulletin
    ref: dev
    for: >
      Netlify blobs, edge functions, and functions on a Decanter 8 project.
      Closest thing to next-ssr in production.
  - repo: ood-giving-campaign
    ref: dev
    for: >
      A small campaign site on this host. Closest in scope to a unit site.
      NOTE: like the rest of this family it is Storyblok-backed, which is out of
      scope here. Read it for host wiring and site shape, not for content
      plumbing. See standards/scope.md.

gotchas:
  - >
    The homesite gates its headers on being on Netlify and returns [] locally.
    Copy that, or spend a day fighting your own CSP in development.
  - >
    Do not import the homesite's two-CSP-policy pattern. It exists so a CMS
    Visual Editor can iframe the site while the app cannot, and there is no CMS
    in scope here. The SAMEORIGIN default from capabilities.yml is enough.
  - >
    Deploying from an individual's personal Netlify account rather than a team
    breaks the named-admin-access requirement the day that person leaves.

# ------------------------------------------------------------------ provisioning
# The agent-run path, for a project that has already decided Netlify per the
# table above. NOT VERIFIED against a live deploy the way github-pages.yml's
# steps are: no project in this repo runs Netlify yet. Treat every step as
# reasoned from the Netlify CLI's own --help output and documentation, and from
# how the ADAPT/OOD family is shaped -- not as proven. Correct this file the
# first time someone actually runs it. The `sws-netlify` skill drives these in
# order.
#
# THE SHAPE IS DIFFERENT FROM GITHUB PAGES, and that difference is the thing to
# get right rather than paper over: `gh` can do the entire GitHub-side job
# headlessly, because a GitHub PAT or OAuth grant is enough to create a repo,
# push, and flip on Pages. Netlify's git-based continuous deployment instead
# needs the Netlify account to hold a GitHub App authorization scoped to the
# repo, and granting that is an OAuth consent screen -- there is no API call
# that substitutes for it. requirements.yml already reflects this: netlify-cli
# is `optional`, because deploy comes from the git integration, not the CLI.
provisioning:
  prerequisite:
    run: |
      npx sws preflight        # then install what it names, then run it again
    needs: >
      git, mandatory regardless of host (same reasoning as github-pages.yml).
      The Netlify CLI (`netlify-cli`, binary `netlify`) is OPTIONAL here --
      useful for env vars, verification, and a manual first deploy, but not
      required to make push-to-main deploy.
    the_decision: >
      Use the CLI where it helps (env vars, verification) and the dashboard
      where the CLI cannot substitute for it (the GitHub App authorization).
      There is no MCP-server alternative worth adding: the one step that
      genuinely needs a browser needs it regardless of transport.
    version_floor: Anything current. Install latest; do not pin.

  steps:
    - id: auth
      what: Authenticate. Opens a browser; there is no headless flow.
      run: |
        netlify status || netlify login
      note: >
        `netlify login` opens an OAuth flow in a browser and stores the token in
        the CLI's own global config, not in the project. `netlify status` first
        makes a re-run a no-op, same reasoning as `gh auth status`.
      honest_limit: >
        Creating a NETLIFY ACCOUNT, as opposed to logging into an existing one,
        needs a browser and cannot be scripted -- the same shape of limit as
        GitHub account creation in github-pages.yml.

    - id: choose-team
      what: Decide which team owns the site. Ask; do not assume.
      note: >
        PREFER A TEAM, NOT A PERSONAL ACCOUNT, for the same reason as
        github-pages.yml's choose-owner step: a site whose only deploy access
        belongs to one person breaks named-admin-access the day that person
        leaves. If they have no team access, that is an escalation, not
        something to work around -- see standards/policy/escalation.md.

    - id: create-and-connect
      what: >
        Create the site AND connect it to the GitHub repo for continuous
        deployment, in one interactive run.
      run: |
        netlify init
      note: >
        `netlify init`, run from inside the repo, asks whether to create a new
        site or link an existing one, then which team, then walks the GitHub
        App authorization if the team has not already granted it for this repo,
        then asks for the build command and publish directory. THIS is the step
        that opens a browser for the git-provider consent screen -- say so
        before running it rather than letting a window appear unexplained.
        Once the team's GitHub App grant already covers new repos in that org,
        later projects skip the consent screen entirely.
      honest_limit: >
        NOT VERIFIED end to end. Reasoned from `netlify init --help` and
        Netlify's own continuous-deployment documentation.

    - id: build-config
      what: Commit `netlify.toml` for build settings and headers.
      source: standards/recipes/astro-ssr/RECIPE.md, step 8b
      note: >
        Prefer config that travels with the repo over dashboard settings, for
        the same reason secrets go in Vault rather than a host UI: it survives
        a dashboard reorganisation and a person leaving. Reserve
        `netlify env:set` for values that must not be committed, and prefer
        `netlify-plugin-vault-variables` per the family convention over
        hand-set dashboard values -- see `no-committed-secrets` above.

    - id: verify
      what: Confirm the deploy, and check what MinWeb asks for while you are here.
      run: |
        netlify open
        netlify api getSite --data '{"site_id": "<site-id>"}'
      note: >
        Unlike `gh api repos/.../pages`, which returns a boolean
        `https_enforced`, Netlify's automatic HTTPS is close to unconditional
        for a site on a Netlify-managed domain or a correctly CNAMEd custom one
        -- but that claim is reasoned here, not read back from a live API
        response. Confirm the certificate is actually live on first real use.

  what_this_does_not_do:
    - Approve the stanford.edu subdomain. University Communications, with a lead time.
    - Request the ODA accessibility review. Pre-launch gate, needs lead time.
    - Register with Siteimprove. Required for public sites, its own intake.
    - Attest MFA on the Netlify team dashboard. An administrative login under MinWeb.
    - Name the business owner and technical administrator in .sws/manifest.yml.
    - >
      Wire up netlify-plugin-vault-variables end to end. That is a Vault
      credential exchange the unit's Vault administrator has to grant, not
      something this CLI sequence can provision alone.

procurement: >
  An existing SWS vendor relationship, so nothing new to procure for a project
  joining an existing team account. A NEW account with a new billing
  arrangement is a procurement question: state the obligation, name the office,
  stop. See standards/policy/procurement.md.
