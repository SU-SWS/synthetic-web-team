# Acceptance criteria for recipe: next-ssr
#
# EXTENDS astro-static. Everything about the footer, Identity Bar, accessibility,
# MinWeb, privacy, discoverability, and provenance is shared and lives there.
# Duplicating those criteria would guarantee they drift, which is the failure
# this whole project is organised against.
#
# Only differences belong in this file:
#   - criteria that do not apply here (marked `applies: false`)
#   - criteria whose mechanism differs on Next
#   - criteria that exist only here
#
# Same rules as the parent: every criterion maps to an implemented check or is
# marked manual; `unknown` is never a pass; `block` is reserved for irreversible
# harm, which today is exactly one thing.

recipe: next-ssr
version: 1
extends: astro-static

standard:
  accessibility: WCAG 2.1 AA
  policy_refs: [minweb, minsec/applications/low, accessibility, minpriv]

# ---------------------------------------------------------------- overrides
# These come from the parent but do not apply, or apply differently.
overrides:
  - id: build.static-output
    applies: false
    why: >
      This recipe deliberately does NOT use output: 'export'. Static export
      cannot emit response headers, and also forfeits redirects, rewrites,
      Proxy, ISR, Server Actions, Draft Mode and default-loader image
      optimization. Headers alone are NOT sufficient reason to choose this
      recipe: MinWeb requires none of them. Choose it for the whole list.

  - id: build.base-path
    applies: false
    why: Netlify serves from the root. `base` is an Astro/Pages concern.

  - id: build.site-set
    applies: false
    why: >
      Astro-specific config key. The Next equivalent is metadataBase, checked
      as next.metadata-base below.

  - id: seo.canonical
    mechanism: >
      On Next, canonical URLs come from the App Router metadata API rather than
      a hand-written link element. Check for a rel=canonical link in the built
      output regardless of how it was produced, and if it is missing, point at
      metadataBase rather than at Astro's `site`.

  - id: decanter.entry-css
    mechanism: >
      Look for `@import 'decanter'` in the entry CSS, conventionally
      styles/global.css rather than src/styles/global.css. Also verify the entry
      does NOT begin with `@import 'tailwindcss'`: that is the homesite's
      pattern, correct only because it does not consume Decanter.

# ---------------------------------------------------------------- additions
criteria:
  - id: next.postcss-configured
    requires: >
      postcss.config.mjs registers @tailwindcss/postcss.
    check: decanter
    severity: warn
    weight: 4
    policy: patterns
    note: >
      Next uses the PostCSS plugin. @tailwindcss/vite is the Astro path and does
      not apply here. Without this, Decanter's CSS is imported and never compiled.

  - id: next.no-vite-tailwind
    requires: '@tailwindcss/vite is not a dependency.'
    check: decanter
    severity: warn
    weight: 2
    policy: patterns
    note: Wrong integration for Next. Signals a copied Astro config.

  - id: next.metadata-base
    requires: >
      metadataBase is set in the root layout's metadata export, so canonical and
      Open Graph URLs resolve absolutely.
    check: seo
    severity: warn
    weight: 3
    policy: patterns
    note: The Next equivalent of Astro's `site`, and the same common miss.

  - id: security.csp-present
    requires: >
      RECORDED, NOT REQUIRED. Whether a Content-Security-Policy is configured
      for the deployed environment. Absence is a PASS.
    check: security
    severity: info
    weight: 1
    policy: minsec
    mechanism: >
      Parse next.config.* for a headers() function returning a
      Content-Security-Policy entry. Cannot verify the served header without a
      deployed URL, so report `unknown` rather than `pass` when the config
      cannot be read or is generated dynamically in a way this check cannot
      follow.
    note: >
      CHANGED 2026-09-03. This was severity warn, weight 5, described as "the
      main capability this recipe has and astro-static does not". Both were
      wrong. MinWeb requires no response headers, so a site with no CSP is
      fully compliant, and SWS confirmed nonce CSP is a nice-to-have. Reporting
      a missing CSP as a warning pushed people towards a header that breaks
      pages at content-edit time, which is the opposite of helpful. The
      sensible-default header set in security.headers-set is what this recipe
      actually asserts. See standards/hosting/capabilities.yml.

  - id: security.headers-set
    requires: >
      The sensible default header set is configured: Strict-Transport-Security,
      X-Content-Type-Options, Referrer-Policy, Permissions-Policy, and
      X-Frame-Options.
    check: security
    severity: warn
    weight: 6
    policy: minsec
    mechanism: Parse next.config.* headers(). Report per missing header, not as one failure.
    note: >
      These are deliberately the headers that CANNOT break a page, which is why
      they are a default and CSP is not. Canonical values live in
      standards/hosting/capabilities.yml under default_header_set. Prefer
      X-Frame-Options SAMEORIGIN over DENY: DENY breaks a CMS Visual Editor
      preview and then needs a second policy to work around itself.

  # REMOVED 2026-09-03: security.editor-csp-separate. It asserted that a
  # Storyblok Visual Editor route carries its own CSP and a noindex header.
  # This package is scoped to static content with no CMS (standards/scope.md),
  # so there is no editor route, and a criterion that can only report
  # not_applicable is dead weight in the contract. Returns with the CMS.

  - id: security.csp-strict-dynamic
    requires: >
      IF a CSP is configured, it uses 'strict-dynamic' with nonces rather than a
      host allowlist. Not applicable when there is no CSP, which is the default.
    check: security
    severity: info
    weight: 2
    policy: minsec
    applies_when: a CSP is configured
    note: >
      A CSP built from a long list of allowed hosts drifts, eventually allows
      everything, and makes every future embed a support ticket for someone who
      cannot diagnose it. @netlify/plugin-csp-nonce injects nonces at the edge;
      on Vercel there is no equivalent and it is hand-rolled in proxy.ts.

  - id: security.no-fontawesome-pro
    requires: '@fortawesome/pro-* packages are not dependencies.'
    check: hygiene
    severity: warn
    weight: 2
    policy: patterns
    note: >
      Inherited from the homesite baseline, where it sits behind a licence-gated
      preinstall token check. A unit site copying it gets an install failure and
      a licence nobody mentioned. Use Heroicons.

  - id: next.no-tailwind-config
    requires: No tailwind.config.* file, and Tailwind was not added by the scaffolder.
    check: decanter
    severity: warn
    weight: 2
    policy: patterns
    note: >
      Scaffold with --no-tailwind. The scaffolder's Tailwind setup conflicts with
      the Decanter integration.

  - id: next.theme-extensions-annotated
    requires: >
      Project token overrides in the tailwind/ @theme block carry a comment
      marking what differs from Decanter.
    check: null
    manual: true
    severity: info
    weight: 0
    policy: patterns
    note: >
      ccc-bulletin annotates deviations inline ("/* Differs from Decanter */").
      A comment at the token level is the same discipline as recording a
      divergence in the manifest. Not automatable, worth prompting.

  - id: next.not-homesite-tokens
    requires: >
      The project has not copied www.stanford.edu's tailwind/theme.css.
    check: null
    manual: true
    severity: info
    weight: 0
    policy: patterns
    note: >
      The homesite's tokens are a PARALLEL VOCABULARY, not Decanter's. Copying
      them produces something that looks approximately right and does not use
      the design system, which passes visual review and fails every token check.
      A short theme.css containing only deviations is the tell that this was
      done correctly.
