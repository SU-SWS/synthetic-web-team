name: pages

# Deploys the documentation site in site/ to GitHub Pages.
#
# Shaped exactly as standards/recipes/astro-static/RECIPE.md prescribes:
# push to main deploys, pull requests get checks but no preview (Pages serves
# one site), and nothing here fails except a committed credential.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'standards/fragments/**'   # the footer is generated from the contract
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'standards/fragments/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write          # persistent "Site health" issue on trunk pushes
  pull-requests: write   # PR comment when a PR fired

concurrency:
  group: pages
  cancel-in-progress: false   # per GitHub Pages guidance: queue, do not skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5

      - name: Install
        working-directory: site
        run: npm install

      - name: Confirm Decanter 8, because v7 fails silently
        working-directory: site
        run: |
          V=$(node -p "require('./node_modules/decanter/package.json').version")
          M=$(node -p "require('./node_modules/decanter/package.json').main")
          echo "decanter $V (main: $M)"
          case "$V" in
            8.*) ;;
            *) echo "::error::decanter resolved to $V, expected 8.x. A bare 'npm install decanter' currently gets v7. Use decanter@alpha until 8.0.0 is on latest."; exit 1 ;;
          esac
          test "$M" = "src/css/index.css" || { echo "::error::decanter main is $M, expected src/css/index.css (v7 detected)"; exit 1; }

      - name: Build
        working-directory: site
        run: npm run build

      # Advisory. Writes to the job summary so a trunk push reports somewhere a
      # person will actually look. Never fails the build.
      - name: Compliance report
        working-directory: site
        continue-on-error: true
        run: |
          npm --prefix ../packages/cli ci
          node ../packages/cli/bin/sws.mjs check --standards ../standards --format terminal
          node ../packages/cli/bin/sws.mjs check --standards ../standards --format markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    # Pages serves one site, so pull requests get checks and no preview.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
