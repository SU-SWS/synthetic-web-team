name: static

# Deploys the documentation site in site/ to GitHub Pages.
#
# Shaped exactly as standards/recipes/astro-static/RECIPE.md prescribes:
# push to main deploys, pull requests get checks but no preview (Pages serves
# one site), and nothing here fails except a committed credential.
#
# ---------------------------------------------------------------------------
# ONE-TIME REPOSITORY SETUP, REQUIRED. This workflow cannot do it for you.
#
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# Until that is set, the `github-pages` environment keeps the default
# deployment-branch protection and the deploy job fails with:
#
#   Branch "main" is not allowed to deploy to github-pages due to
#   environment protection rules.
#
# If it still fails after switching the source, check
# Settings -> Environments -> github-pages -> Deployment branches and allow
# your default branch.
#
# This is the step the recipe calls out as "outside the workflow and easy to
# forget". It was duly forgotten on the first run of this very workflow.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'standards/fragments/**'   # the footer is generated from the contract
      - '.github/workflows/static.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'standards/fragments/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write          # persistent "Site health" issue on trunk pushes
  pull-requests: write   # PR comment when a PR fired

concurrency:
  group: pages
  cancel-in-progress: false   # per GitHub Pages guidance: queue, do not skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/configure-pages@v6

      # The CLI and its workspace-linked @su-sws/standards, installed once from
      # the repository root. Must precede any step that runs sws.
      - name: Install the toolchain
        run: npm ci

      - name: Install
        working-directory: site
        run: npm install

      - name: Confirm Decanter 8, because v7 fails silently
        working-directory: site
        run: |
          V=$(node -p "require('./node_modules/decanter/package.json').version")
          M=$(node -p "require('./node_modules/decanter/package.json').main")
          echo "decanter $V (main: $M)"
          case "$V" in
            8.*) ;;
            *) echo "::error::decanter resolved to $V, expected 8.x. A bare 'npm install decanter' currently gets v7. Use decanter@beta until 8.0.0 is on latest (latest is 7.5.3 as of 2026-09-01)."; exit 1 ;;
          esac
          test "$M" = "src/css/index.css" || { echo "::error::decanter main is $M, expected src/css/index.css (v7 detected)"; exit 1; }

      - name: Build
        working-directory: site
        run: npm run build

      # axe runs as its own step, before the report that reads its output.
      # Separate on purpose: a browser download failure is legible here, and
      # buried inside a compliance report it is not. Always exits 0 -- a
      # failure to run becomes `unknown` in the report, never a false pass.
      - name: Accessibility (axe, WCAG 2.1 AA)
        working-directory: site
        continue-on-error: true
        run: |
          npx --yes playwright install --with-deps chromium
          node ../packages/cli/bin/sws.mjs a11y

      # Byte budget, not Lighthouse: a Lighthouse score swings ten points
      # between runs on a shared runner, and this score is trended. Reuses the
      # browser installed above.
      - name: Performance budget
        working-directory: site
        continue-on-error: true
        run: node ../packages/cli/bin/sws.mjs perf

      # Advisory. ONE invocation: the CLI appends to the job summary itself when
      # it detects GITHUB_STEP_SUMMARY. Calling it twice and also redirecting
      # printed the report three times on the first real run.
      # GITHUB_TOKEN is NOT in the environment by default; without it the CLI
      # silently skips publishing and says so on stdout.
      #
      # The badge goes INSIDE dist so it deploys with the site, which is what
      # lets the README badge work with no gist, no secret, and no service
      # beyond shields.io. That is safe because `badge.json` at the dist root is
      # in CLI_ARTIFACTS (see packages/cli/src/browser.mjs) and therefore
      # excluded from the build-staleness calculation.
      #
      # Anything ELSE written into dist between the build and `sws check` will
      # invalidate the axe and perf measurements, which then report `unknown`
      # and withhold their points. So --html goes outside dist.
      - name: Compliance report
        working-directory: site
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ../packages/cli/bin/sws.mjs check --standards ../standards \
            --html ../compliance-report.html \
            --badge dist/badge.json

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.html
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    # Pages serves one site, so pull requests get checks and no preview.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
