name: release

# Every push to main cuts a release. Patch by default.
#
#   [minor] / [major]   in the commit message, to bump further
#   [skip release]      in the commit message, to cut nothing
#   workflow_dispatch   to choose the bump by hand, including `none` to publish
#                       the version already in package.json without bumping
#
# Two packages ship, in lockstep and in order: @su-sws/synthetic-web-team then
# @su-sws/synthetic-web-team-mcp, because the second depends on the first. scripts/set-version.mjs
# owns the version arithmetic and the dependency rewrite -- see the header of
# that file for why `npm version` cannot do this job.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write   # push the version commit, the tag, and the release
  id-token: write   # npm provenance, which needs OIDC and a public repo

# Never cancel a release in flight. A cancelled run can leave the tag pushed and
# the package unpublished, which is the one state that needs a human.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip our own version commit. The push below uses GITHUB_TOKEN, and GitHub
    # deliberately does not raise workflow events for those, so this is belt and
    # braces -- but the day someone swaps in a PAT to get around a branch
    # protection rule, this is what stops an infinite release loop.
    if: >
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, 'chore: release v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed so the tag and version commit can be pushed back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Workspace repo: one lockfile at the root. A per-package install cannot
      # work, because the packages link to each other from packages/.
      - run: npm ci

      # The gates run BEFORE anything is versioned or published. A release is
      # the one place in this project where a failing check should stop the
      # line: everything else here is advisory, but publishing a broken tarball
      # to a public registry is not reversible.
      - name: Validate
        run: npm run check

      - name: Decide the bump
        id: bump
        env:
          MSG: ${{ github.event.head_commit.message }}
          DISPATCH: ${{ github.event.inputs.bump }}
        run: |
          if [ -n "$DISPATCH" ]; then
            BUMP="$DISPATCH"
          elif printf '%s' "$MSG" | grep -qiE '\[major\]'; then
            BUMP=major
          elif printf '%s' "$MSG" | grep -qiE '\[minor\]'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP"

      - name: Set the version
        id: version
        run: |
          if [ "${{ steps.bump.outputs.bump }}" = "none" ]; then
            V=$(node -p "require('./package.json').version")
            echo "Publishing the existing version, no bump: $V"
          else
            V=$(node scripts/set-version.mjs "${{ steps.bump.outputs.bump }}" | grep '^version=' | cut -d= -f2)
            npm install --package-lock-only
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Refuse to republish a version that already exists. npm would reject it
      # anyway, but it would do so AFTER the tag and commit were pushed, leaving
      # the repository claiming a release that is not on the registry.
      - name: Check the version is not already published
        run: |
          V="${{ steps.version.outputs.version }}"
          if npm view "@su-sws/synthetic-web-team@$V" version >/dev/null 2>&1; then
            echo "::error::@su-sws/synthetic-web-team@$V is already on npm. Use a different bump."
            exit 1
          fi
          echo "$V is unpublished. Proceeding."

      - name: Commit and tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: release v$V [skip release]"
          git tag -a "v$V" -m "v$V"
          # A non-fast-forward here means main moved while this ran, and the
          # push fails. That is the outcome to want: it happens BEFORE any
          # publish, so the registry is untouched and the only cost is a re-run.
          git push origin HEAD:main --follow-tags

      - name: Tag only
        if: steps.bump.outputs.bump == 'none'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"

      # Root first. @su-sws/synthetic-web-team-mcp declares a dependency on it, so publishing the
      # server first leaves it briefly uninstallable.
      - name: Publish @su-sws/synthetic-web-team
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @su-sws/synthetic-web-team-mcp
        run: npm publish -w @su-sws/synthetic-web-team-mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # --generate-notes already diffs against the previous tag on its own.
          # An explicit --notes-start-tag would need handling for the very first
          # release, where there is no previous tag to name.
          gh release create "v$V" --title "v$V" --generate-notes
