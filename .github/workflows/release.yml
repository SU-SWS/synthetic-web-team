name: release

# Every push to main cuts a release. Patch by default.
#
#   [minor] / [major]   in the commit message, to bump further
#   [skip release]      in the commit message, to cut nothing
#   workflow_dispatch   to choose the bump by hand, including `none` to publish
#                       the version already in package.json without bumping
#
# Two packages ship, in lockstep and in order: @su-sws/synthetic-web-team then
# @su-sws/synthetic-web-team-mcp, because the second depends on the first.
# scripts/set-version.mjs owns the version arithmetic and the dependency
# rewrite -- see the header of that file for why `npm version` cannot do it.
#
# Authentication is TRUSTED PUBLISHING over OIDC, so there is no npm token in
# this repository and nothing that expires in 90 days. It is configured on
# npmjs.com per package, against this repository and this filename.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write   # push the version commit, the tag, and the release
  id-token: write   # npm provenance, which needs OIDC and a public repo

# Never cancel a release in flight. A cancelled run can leave the tag pushed and
# the package unpublished, which is the one state that needs a human.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip our own version commit. The push below uses GITHUB_TOKEN, and GitHub
    # deliberately does not raise workflow events for those, so this is belt and
    # braces -- but the day someone swaps in a PAT to get around a branch
    # protection rule, this is what stops an infinite release loop.
    if: >
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, 'chore: release v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed so the tag and version commit can be pushed back.
          token: ${{ secrets.GITHUB_TOKEN }}

      # NO registry-url ON PURPOSE, and this is load-bearing.
      #
      # `registry-url` makes setup-node write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no NODE_AUTH_TOKEN set that resolves to an EMPTY credential.
      # npm then believes it already has one and skips the OIDC exchange
      # entirely, so the publish goes out unauthenticated and the registry
      # answers 404 -- npm returns 404 rather than 403 for permission failures,
      # which makes it read like the package does not exist.
      #
      # registry.npmjs.org is npm's default anyway, so naming it bought nothing
      # and cost the whole trusted-publishing flow. Verified the hard way on the
      # v0.1.1 release, which signed provenance and then 404'd on the PUT.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Trusted publishing needs an npm that can do the OIDC exchange. Latest,
      # not pinned, per the house rule in AGENTS.md -- and then asserted, so the
      # failure is "npm is too old" rather than an opaque 401 three steps later.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          V=$(npm --version)
          node -e '
          const v = process.argv[1];
          const [maj, min, patch] = v.split(".").map(Number);
          const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
          if (!ok) {
            console.log("::error::npm " + v + " cannot do trusted publishing. Needs 11.5.1 or newer.");
            process.exit(1);
          }
          console.log("npm " + v + " supports trusted publishing.");' "$V"

      # So the next auth failure names its own cause instead of surfacing as a
      # 404 eighty lines into a tarball listing.
      - name: Publishing context
        run: |
          echo "npm:  $(npm --version)"
          echo "node: $(node --version)"
          echo "OIDC token URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO — id-token: write is missing}"
          echo "registry: $(npm config get registry)"
          echo ".npmrc files npm can see:"
          npm config ls -l 2>/dev/null | grep -i "^; .*npmrc" || echo "  (none reported)"
          if [ -f "$HOME/.npmrc" ]; then
            echo "  HOME/.npmrc keys:"; sed 's/=.*/=<redacted>/' "$HOME/.npmrc" | sed 's/^/    /'
          fi

      # Workspace repo: one lockfile at the root. A per-package install cannot
      # work, because the packages link to each other from packages/.
      - run: npm ci

      # The gates run BEFORE anything is versioned or published. A release is
      # the one place in this project where a failing check should stop the
      # line: everything else here is advisory, but publishing a broken tarball
      # to a public registry is not reversible.
      - name: Validate
        run: npm run check

      - name: Decide the bump
        id: bump
        env:
          MSG: ${{ github.event.head_commit.message }}
          DISPATCH: ${{ github.event.inputs.bump }}
        run: |
          if [ -n "$DISPATCH" ]; then
            BUMP="$DISPATCH"
          elif printf '%s' "$MSG" | grep -qiE '\[major\]'; then
            BUMP=major
          elif printf '%s' "$MSG" | grep -qiE '\[minor\]'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP"

      - name: Set the version
        id: version
        run: |
          if [ "${{ steps.bump.outputs.bump }}" = "none" ]; then
            V=$(node -p "require('./package.json').version")
            echo "Publishing the existing version, no bump: $V"
          else
            V=$(node scripts/set-version.mjs "${{ steps.bump.outputs.bump }}" | grep '^version=' | cut -d= -f2)
            npm install --package-lock-only
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Refuse to republish a version that already exists. npm would reject it
      # anyway, but it would do so AFTER the tag and commit were pushed, leaving
      # the repository claiming a release that is not on the registry.
      - name: Check the version is not already published
        run: |
          V="${{ steps.version.outputs.version }}"
          if npm view "@su-sws/synthetic-web-team@$V" version >/dev/null 2>&1; then
            echo "::error::@su-sws/synthetic-web-team@$V is already on npm. Use a different bump."
            exit 1
          fi
          echo "$V is unpublished. Proceeding."

      - name: Commit and tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: release v$V [skip release]"
          git tag -a "v$V" -m "v$V"
          # A non-fast-forward here means main moved while this ran, and the
          # push fails. That is the outcome to want: it happens BEFORE any
          # publish, so the registry is untouched and the only cost is a re-run.
          git push origin HEAD:main --follow-tags

      # The `none` path is also the RETRY path: it is how you finish a release
      # whose tag landed but whose publish failed. So the tag must already be
      # allowed to exist -- recreating it would abort the run and leave the
      # release stuck exactly where it was.
      - name: Tag only
        if: steps.bump.outputs.bump == 'none'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists, leaving it as it is. Retry path."
          else
            git tag -a "v$V" -m "v$V"
            git push origin "v$V"
          fi

      # TRUSTED PUBLISHING. There is no NPM_TOKEN and no secret to rotate: npm
      # authenticates this workflow by its OIDC identity, which is why the job
      # asks for `id-token: write` above.
      #
      # THE TRUST IS CONFIGURED PER PACKAGE ON NPMJS.COM, and it names this
      # repository AND THE FILENAME OF THIS FILE. Renaming release.yml, or
      # moving these publish steps into another workflow, breaks publishing with
      # an authentication error that looks nothing like the cause. Change the
      # trusted publisher settings first if you ever move this.
      #
      # Provenance is generated automatically under trusted publishing; the flag
      # stays because it makes a missing OIDC context fail loudly here rather
      # than silently shipping an unattested tarball.
      #
      # Root first. @su-sws/synthetic-web-team-mcp declares a dependency on it,
      # so publishing the server first leaves it briefly uninstallable.
      - name: Publish @su-sws/synthetic-web-team
        run: npm publish --provenance --access public

      - name: Publish @su-sws/synthetic-web-team-mcp
        run: npm publish -w @su-sws/synthetic-web-team-mcp --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # --generate-notes already diffs against the previous tag on its own.
          # An explicit --notes-start-tag would need handling for the very first
          # release, where there is no previous tag to name.
          #
          # Tolerant of an existing release for the same reason the tag step is:
          # this runs after publishing, so on a retry the publish may be the
          # only part that was missing.
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists, leaving it as it is."
          else
            gh release create "v$V" --title "v$V" --generate-notes
          fi
