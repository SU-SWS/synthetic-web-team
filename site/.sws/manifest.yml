# The project's own documentation site. Deliberately built with astro-static and
# checked by sws, so the standards are proven on something real rather than only
# described.

standards_version: 0.1.0
recipe: astro-static
created: 2026-08-11

tier: low
tier_because: >
  Public documentation only. No forms, no authentication, no personal
  information, no analytics.

site:
  name: "Synthetic Web Team"
  unit: "Stanford Web Services"
  purpose: "Explain the project and give people the prompt that installs it"
  url: "https://su-sws.github.io/synthetic-web-team"

owners:
  business:
    name: "Shea McKinney"
    email: "sheamck@stanford.edu"
  technical:
    name: "Shea McKinney"
    email: "sheamck@stanford.edu"

# github.io, not a stanford.edu subdomain, so no University Communications
# name approval applies and Siteimprove registration is not required.
siteimprove:
  registered: not_applicable
  why: >
    Not a stanford.edu domain. If this ever moves to a Stanford subdomain,
    Siteimprove registration becomes required and the subdomain needs
    University Communications approval.

accessibility:
  standard: WCAG 2.1 AA
  oda_review_requested: null

editors: []
skills_installed: 25

resolved:
  astro: "7.2.1"
  decanter: "8.0.0-beta.0"     # installed via `decanter@beta`; `latest` is 7.5.3
  tailwindcss: "4.3.3"
  motion: "13.1.1"             # vanilla entry, not motion/react. See `motion:` below
  "@playwright/test": "1.62.1"
  "@axe-core/playwright": "4.13.0"
  axe-core: "4.13.0"           # transitive, and the version the report cites

accessibility_testing:
  tool: axe-core via @axe-core/playwright, run by `sws a11y`
  tags: [wcag2a, wcag2aa, wcag21a, wcag21aa]
  last_result: 0 violations across 1 route, 26 rules / 495 nodes passing, 1 incomplete
  incomplete_detail: >
    One color-contrast result, on hero text over the decorative gradient. axe
    could not determine the background. Reviewed by hand and recorded under
    `design.contrast_review`; that review found and fixed a genuine failure.
  coverage_note: >
    Node coverage matters here because entry motion hides below-fold content
    until it scrolls into view, and axe skips invisible elements. On the previous
    version of this page, unscrolled it audited 116 nodes and reported a clean
    pass; scrolled, 145. The runner now scrolls before auditing. The redesigned
    page audits 496.
  caveat: >
    Automation covers roughly 30 percent of issues per ODA guidance. The manual
    WCAG 2.1 AA checklist has not been done for this site.

identity_bar:
  contract: standards/fragments/identity-bar.yml
  corrected: 2026-09-02
  was: >
    bg-cardinal-red with an inner `mx-auto max-w-[144rem] px-20 py-12 md:px-30`
    wrapper and `font-serif text-24 md:text-27` on the link. Measured about 44px
    tall and used the wrong font mechanism.
  now: >
    The upstream markup verbatim: `px-20 pt-5 pb-1 sm:px-30 md:px-50 lg:px-30` on
    the red container, and `logo inline-block text-20 leading-none text-white
    no-underline hocus:text-white hocus:underline` on the link. Measures 28.8px
    at a 1280px viewport.
  how_found: >
    Spotted by eye, side by side with the Decanter 8 docs site. Nothing in the
    toolchain caught it, because there was no contract to check against -- the
    Identity Bar was verified for PRESENCE and DOM POSITION only. The fragment
    and brand.identity-bar.exact now close that gap.

design:
  aesthetic: >
    After the Decanter 8 beta documentation site
    (deploy-preview-162--decanter.netlify.app): dark near-black sections
    alternating with fog-light, an uppercase eyebrow above each heading, large
    tight-tracked headings, and code in terminal-style panels with window dots,
    a filename, a language pill and a copy button.
  syntax_highlighting: >
    Astro's <Code> component, which is Shiki at BUILD time. Zero client
    JavaScript for syntax colour; a client-side highlighter would have cost more
    than every other script on this page combined.
  contrast_review: >
    axe reported color-contrast as INCOMPLETE for the hero, not passing: the
    decorative grid and plum bloom made the background indeterminate. Those
    pairs were therefore computed by hand against the worst-case blended
    background (#471f40 = black + plum at 42% + grid at 18%).
    white #FFFFFF 13.65:1 pass. black-20 #D5D5D4 9.30:1 pass.
    black-30 #C0C0BF 7.50:1 pass.
    digital-red-xlight #F83535 3.61:1 FAIL at 13px, needing 4.5:1.
    That last one was a real WCAG failure axe could not report. The version pill
    became white on solid digital red (7.26:1), which is also something axe can
    measure. This is the roughly 70 percent automation cannot see, made concrete.

install_pathways:
  - kind: prompt
    what: >
      Three copy-a-prompt boxes on the page: install, review an existing project,
      and update. The easiest path, and the one most people will use.
    honesty_note: >
      Each prompt names BOTH the npx route and a git clone fallback, because
      nothing is published to npm yet. Verified: `npx @su-sws/create-web-team`
      returns E404 today, and the clone route installs 87 files. A prompt naming
      only npx would send every agent into a 404.
    encodes: >
      Never invent an owner name or email (MinWeb requires real ones), stop on a
      conflict rather than overwriting an edit, and read AGENTS.md as an ongoing
      contract rather than a setup step.
  - kind: cli
    what: "npx @su-sws/create-web-team --json --answers '{...}'"
  - kind: mcp
    what: sws_scaffold, for an agent that already has the server configured

motion:
  pattern: standards/patterns/motion.md
  library: "motion 13.1.1, vanilla API (animate + inView), not motion/react"
  implementation: src/scripts/animate-in-view.ts
  behaviour: viewport entry, once, 500ms easeOut, 150ms stagger between siblings
  hero: not animated -- already in the viewport, and the h1 is the LCP element
  why_not_react: >
    The SWS reference implementation (sws-astro AnimateInView) uses motion/react
    in a React island, which is right for that project because it is already
    React-based. Measured here on the same page and the same animations:
    motion/react plus React 19 cost 266.7 KB of JavaScript and breached the
    150 KB js budget; the vanilla API cost 60.4 KB and passed. 77 percent less
    for identical motion, so React was not added.
  no_js_behaviour: >
    Content is never hidden without JavaScript. The hidden starting state is
    scoped to a `.js` class added by an inline script before first paint, so if
    the script does not run nothing is hidden. Verified with JavaScript
    disabled: 0 of 13 animated blocks invisible. The React path bakes
    opacity:0 into the server HTML and does not have this property.

performance:
  tool: "`sws perf`, first-party uncompressed bytes in Chromium"
  budget: standards/stack/performance-budget.yml v1
  last_result: 101.2 KB of 800 KB budget, 3 first-party requests (js 60.4)
  measurement_note: >
    Measured after scrolling the page, because lazily hydrated islands do not
    request their JavaScript until they approach the viewport. Before that fix
    the same page reported 52.9 KB and 2 requests, omitting the animation
    JavaScript entirely.
  third_party_origins:
    - https://fonts.googleapis.com
    - https://fonts.gstatic.com
  third_party_note: >
    157 KB of fonts from two Google origins. Not a decision anyone made: Decanter
    ships no font assets, so the CDN reference is its default. Flagged here
    because a third-party origin is a MinPriv disclosure question as well as a
    performance cost. Self-hosting the two faces would remove both.

prior_art:
  - what: Decanter 7-to-8 class migration
    from: https://github.com/SU-SWS/decanter/blob/main/UPGRADE.md
    how: >
      Upgrading alpha.1 to beta.0 required renaming foggy-light and foggy-dark to
      fog-light and fog-dark in three files. Verified the beta's colors.css no
      longer defines a foggy token, so the old classes compiled to nothing: a
      silent background-colour regression with a green build. This is the failure
      mode the class-delta table in standards/patterns/decanter.md exists to
      prevent.
  - what: Global Footer markup
    from: standards/fragments/global-footer.yml
    how: >
      Generated at build time rather than transcribed. Two of the ten URLs were
      wrong in this project's first draft because they were typed from memory.

divergences:
  - from: astro-static
    changed: Site lives in a site/ subdirectory rather than at the repository root
    reason: >
      The repository is primarily the standards package; the docs site is a
      sub-project. Running sws from site/ works, and the workflow check walks up
      to find repository-level CI.
    cost_accepted: >
      A subdirectory layout is slightly unusual and needed a `base` path, which
      is gotcha 4 in the recipe. Exercising it here is a feature.
    date: 2026-08-11
    by: sheamck@stanford.edu
